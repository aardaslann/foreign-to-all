; Foreign to All - export presets.
;
; This file did not exist, and was in .gitignore lumped in with .godot/ under
; "editor state, regenerated on open". It is neither: it is the build
; configuration, and without it nobody can produce a runnable copy of this game
; on any machine, including this one. It holds no credentials - these are
; desktop targets and Mac signing is ad-hoc only - so there is nothing in it that
; should be kept out of version control.
;
; To build:
;   <godot> --headless --path . --export-release "Windows Desktop" build/windows/ForeignToAll.exe
;
; Export templates for the exact engine version (4.7.2.stable) have to be
; installed first, or the export fails with "No export template found". In the
; editor: Editor > Manage Export Templates > Download and Install.
;
; exclude_filter is doing real work. The repository carries tens of megabytes
; no player needs: the Obsidian vault, the Remotion promo film, the design
; docs, and twenty-odd verification tools that only ever run headless from a
; command line.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="art/environments/layouts.json, art/environments/fullsize.json, art/environments/berlin-gameplay.json, art/environments/istanbul-gameplay.json, art/environments/city-gameplay.json, art/environments/object-geometry.json, art/environments/lettering.json, art/environments/activity-plates.json, art/environments/city-activity-plates.json, art/environments/activity-staging.json, art/environments/city-activity-staging.json, art/environments/activity-sets.json, art/environments/activity-direction.json, audio/voice/manifest.json, art/environments/activity-world.json, art/fonts/*-OFL.txt"
exclude_filter="art/environments/review/*, art/environments/city-art-batches/*, tools/*, trailer/*, docs/*, Foreign to All/*, .build/*, build/*, .git/*, *.md, *.py, *.ps1, *.pyc, *.mp4, *.env"
export_path="build/windows/ForeignToAll.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
; One file rather than an .exe that silently needs the .pck beside it. Somebody
; sent the executable on its own would get a black window and no explanation,
; and that is the most likely way this game will be handed to anybody.
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.2.1.3"
application/product_version="0.2.1.3"
application/company_name="Arda Aslan"
application/product_name="Foreign to All"
application/file_description="A game about arriving somewhere you cannot read"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false

